appId: kr.publisher.questionbank
productName: 문제은행
executableName: QuestionBank
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/tesseract.js-core/tesseract-core-lstm.*'
  - '!**/node_modules/tesseract.js-core/tesseract-core-simd-lstm.*'
  - '!**/node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.*'
  - '!**/node_modules/tesseract.js/dist/**'
  - '!**/node_modules/tesseract.js/docs/**'
  - '!**/node_modules/tesseract.js/examples/**'
  - '!**/node_modules/@tesseract.js-data/kor/4.0.0/**'
  - '!**/node_modules/pdfjs-dist/build/**'
  - '!**/node_modules/pdfjs-dist/web/**'
  - '!**/node_modules/pdfjs-dist/types/**'
  - '!**/node_modules/pdfjs-dist/image_decoders/**'
  - '!**/node_modules/pdfjs-dist/legacy/web/**'
  - '!**/node_modules/pdfjs-dist/legacy/image_decoders/**'
  - '!**/node_modules/pdfjs-dist/legacy/build/*.min.mjs'
  - '!**/node_modules/pdfjs-dist/legacy/build/pdf.sandbox.mjs'
npmRebuild: false
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/pdfjs-dist/**'
  - '**/node_modules/@napi-rs/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'
  - '**/node_modules/@tesseract.js-data/kor/**'
  - '**/node_modules/wasm-feature-detect/**'
  - '**/node_modules/zlibjs/**'
  - '**/node_modules/bmp-js/**'
  - '**/node_modules/is-url/**'
  - '**/node_modules/node-fetch/**'
  - '**/node_modules/whatwg-url/**'
  - '**/node_modules/tr46/**'
  - '**/node_modules/webidl-conversions/**'
  - '**/node_modules/regenerator-runtime/**'
  - '**/node_modules/idb-keyval/**'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: QuestionBank-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 문제은행
publish:
  provider: github
  owner: magic3899-star
  repo: question-bank
